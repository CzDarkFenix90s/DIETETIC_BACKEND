<!DOCTYPE html>
<html>
<head>
    <style>
        .container { font-family: sans-serif; padding: 20px; text-align: center; }
        .code { font-size: 32px; font-weight: bold; color: #4CAF50; letter-spacing: 5px; padding: 10px; border: 2px dashed #4CAF50; display: inline-block; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Verifica tu cuenta de Dietética</h2>
        <p>Hola {{ username }}, gracias por registrarte. Tu código de verificación es:</p>
        <div class="code">{{ code }}</div>
        <p>Ingresa este código en la aplicación para activar tu cuenta.</p>
    </div>
</body>
</html>
